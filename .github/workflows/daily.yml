name: 每日60秒日报

on:
  # 首次上传脚本时自动跑一次（只对脚本变更生效，产物提交不会触发，不会循环）
  push:
    paths:
      - 'shot.js'
      - '.github/workflows/daily.yml'
  schedule:
    # 【第三道兜底】GitHub 自己的 cron 在本仓库实测不可靠：
    #   11-11 / 11-12 六个点位全部延迟 3.5~7 小时；11-13 六个点位连排队都没有，直接丢弃。
    # 所以主触发已经交给云端定时器（见 CLOUD_CRON.md），这里只保留 3 个点位当免费兜底。
    - cron: '0 23 * * *'    # 北京 07:00
    - cron: '0 0 * * *'     # 北京 08:00
    - cron: '0 1 * * *'     # 北京 09:00
  workflow_dispatch:        # 手动 / 云端定时器都是走这个口子（即时执行，不排队）
    inputs:
      force:
        description: '强制重新生成（忽略「今天已生成」检查）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-60s
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 幂等闸门：当天已经生成过「新鲜」的图就立刻收工（只花 8 秒）
      # 云端定时器每 10 分钟打一次这个 workflow，全靠这道闸门把重复触发挡掉。
      # 只有显式勾了 force=true（手动 / 云端带参）才无条件重跑。
      - name: 今天是否已生成
        id: gate
        run: |
          TODAY=$(date -u -d '+8 hours' +%F)
          echo "今天(北京)=$TODAY  触发方式=${{ github.event_name }}  force=${{ github.event.inputs.force }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "强制重跑，跳过新鲜度检查"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 生成窗口：北京 05:30 ~ 11:00。
          # 云端定时器是全天每 10 分钟打一次，凌晨触发时源站还没更新当天内容，
          # 跑出来只会是一张"未更新"的图，所以窗口外一律跳过（要补图就勾 force）。
          # 用 UTC+8 换算，不写 TZ=Asia/Shanghai —— 精简镜像里可能没有 tzdata，
          # 那样 TZ 会静默失效、拿到 UTC 时间，判断就全错了。
          HM=$(date -u -d '+8 hours' +%H%M)
          HM=$((10#$HM))          # 去掉前导零，否则 0805 会被当成八进制报错
          if [ "$HM" -lt 530 ] || [ "$HM" -gt 1100 ]; then
            echo "⏰ 当前北京 $HM，不在生成窗口（05:30~11:00），跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          INFO=$(curl -fsS -m 20 "https://raw.githubusercontent.com/${{ github.repository }}/main/api.json" \
                 | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('date',''), str(d.get('stale')).lower())" 2>/dev/null)
          set -e
          echo "线上状态：$INFO"
          HAVE_DATE=$(echo "$INFO" | awk '{print $1}')
          HAVE_STALE=$(echo "$INFO" | awk '{print $2}')
          if [ "$HAVE_DATE" = "$TODAY" ] && [ "$HAVE_STALE" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ 今天($TODAY)的图已经生成且内容新鲜，跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "需要生成：线上=$HAVE_DATE stale=$HAVE_STALE"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: 安装中文字体
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装 Playwright
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm init -y > /dev/null 2>&1
          npm i playwright
          npx playwright install --with-deps chromium

      - name: 截图并生成 api.json
        if: steps.gate.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          # 带 token 调 GitHub 搜索接口，限速从 10 次/分提到 30 次/分
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node shot.js

      - name: 提交更新
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 60s.png api.json
          if git diff --cached --quiet; then
            echo "内容没有变化，跳过提交"
            exit 0
          fi
          # 运行期间可能有别的提交进来（比如你又推了脚本），直接 push 会被拒
          # 被拒就 fetch 后把改动重新落到远端最新提交之上再推，最多试 5 次
          for i in 1 2 3 4 5; do
            git commit -m "chore: 更新 $(date -u -d '+8 hours' +%F) 日报" || true
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送被拒，改到远端最新提交之上重试（第 $i 次）"
            git fetch origin main
            git reset --soft origin/main
            sleep $((i * 2))
          done
          echo "多次重试仍失败"
          exit 1
